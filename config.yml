    # <-- BIO IS UPDATED BELOW WITH LINE BREAKS
    subtitle: "I study human capital and human decision-making — how skills form and shift, how experts decide under pressure, and how organizations can act on what their data already tells them.<br><br>My research develops measurement frameworks from unstructured data and machine learning. The goal is consistent: to make visible something previously hard to see — whether that is how technology reshapes the structure of occupational skills, how AI adoption changes what firms need from workers, or when expert decision routines break down.<br><br>I work at three levels. Some questions concern broad macro patterns — how technological shocks propagate through labor markets, and who adapts and who doesn't. Some address nuanced behavioral phenomena — the conditions under which expert judgment departs from what experience actually supports. And some focus on actionable insight — frameworks that let organizations use the data they already have to make better decisions about talent.<br><br>The contexts vary: labor markets, firms, competitive sports, financial services. A new direction I am developing asks how differences in the way people work shape their complementarity with generative AI tools — who benefits most, and why.<br><br>I teach at the intersection of technology and economics — how data, machine learning, and AI are applied in business and economic contexts.<br><br>PhD in Information Systems, Carnegie Mellon University. Visiting Assistant Professor, Plaksha University."
